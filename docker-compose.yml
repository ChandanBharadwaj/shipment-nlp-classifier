services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shipment
      POSTGRES_PASSWORD: shipment
      POSTGRES_DB: shipment_db
    ports:
      - "5555:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipment -d shipment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
